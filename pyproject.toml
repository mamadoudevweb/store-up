[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "store-up"
version = "0.1.0"
description = "Shop Management REST API"
requires-python = ">=3.11"
dependencies = [
    # Web framework
    "flask>=3.0",
    "flask-sqlalchemy>=3.1",
    "flask-migrate>=4.0",
    "flask-jwt-extended>=4.6",
    "flask-limiter[redis]>=3.5",
    "flask-cors>=4.0",
    # Validation & settings
    "pydantic[email]>=2.7",
    "pydantic-settings>=2.3",
    "apispec>=6.0",
    "apispec-webframeworks>=1.2",
    # Database
    "sqlalchemy>=2.0",
    "alembic>=1.13",
    "psycopg2-binary>=2.9",        # PostgreSQL driver
    # Redis (JWT denylist + rate limiting backend)
    "redis>=5.0",
    # Security
    "bcrypt>=4.1",
    "python-multipart>=0.0.9",
    # Utilities
    "python-dotenv>=1.0",
    "click>=8.1",
    "werkzeug>=3.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-flask>=1.3",
    "pytest-cov>=5.0",
    "ruff>=0.4",
    "mypy>=1.10",
    "types-redis>=4.6",
    "httpx>=0.27",
    "factory-boy>=3.3",
    "fakeredis>=2.23",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.11"
strict = true
warn_unused_ignores = false
ignore_missing_imports = true
disallow_untyped_decorators = false
disallow_subclassing_any = false
disallow_untyped_calls = false
disallow_untyped_defs = false
disallow_incomplete_defs = false
exclude = ["migrations/", "tests/"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "--cov=src --cov-report=term-missing"
pythonpath = "."

[tool.coverage.run]
source = ["src"]
omit = ["src/domains/*/routes/v1/schemas/*"]
