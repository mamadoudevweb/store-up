name: CD

on:
  push:
    branches: [main]

jobs:
  deploy:
    name: Build & Deploy
    runs-on: ubuntu-latest
    needs: []   # extend with lint-and-test job id if combined workflow

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -e .

      # ── Docker build (optional — adapt to your registry) ──────────────────
      - name: Build Docker image
        run: |
          docker build -t store-up:${{ github.sha }} .
        if: ${{ false }}   # set to true once Dockerfile is added

      # ── Database migrations ────────────────────────────────────────────────
      - name: Run migrations
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          SECRET_KEY: ${{ secrets.SECRET_KEY }}
          FLASK_ENV: production
        run: flask db upgrade
        if: ${{ false }}   # set to true once target environment is configured

      # ── Deploy (placeholder — replace with your deployment target) ─────────
      - name: Deploy
        run: echo "Deployment target not yet configured."
        # Example targets:
        #   - Railway: railway up
        #   - Fly.io:  flyctl deploy --remote-only
        #   - Render:  curl deploy hook from secrets
        #   - VPS:     ssh deploy script
